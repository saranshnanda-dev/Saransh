<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saransh · Aspiring Data Scientist</title>
<meta name="description" content="Portfolio of Saransh, a BCA AI/ML student building a career in data science with Python, SQL and machine learning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6eefb;--surface:#f8f9fc;--ink:#0f1f45;--muted:#4a5670;--line:#cfd6e2;--blue:#3b7bff;--silver:#b9c2d0;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1430;--surface:#111c3c;--ink:#e8edf8;--muted:#9fabc4;--line:#26335a;--blue:#6f9cff;--silver:#7f8aa6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1430;--surface:#111c3c;--ink:#e8edf8;--muted:#9fabc4;--line:#26335a;--blue:#6f9cff;--silver:#7f8aa6;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;line-height:1.65;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 0;font-weight:500;font-size:.9rem}
nav .links{display:flex;gap:22px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--muted)}nav a:hover{color:var(--ink)}
h1{font-size:clamp(3.4rem,10vw,7rem);font-weight:800;line-height:1;margin:0;letter-spacing:-.03em}
.role{font-size:clamp(1.3rem,3.6vw,2.3rem);font-weight:400;color:var(--muted);margin:10px 0 24px;
background:linear-gradient(90deg,transparent 0,var(--muted) 28%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tags{display:flex;flex-wrap:wrap;gap:8px 18px;font-weight:500;color:var(--ink);margin:0 0 28px;padding:0;list-style:none}
.tags li+li::before{content:"•";margin-right:18px;color:var(--silver)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{color:var(--ink);padding:12px 22px;border-radius:999px;font-weight:600;font-size:.9rem;text-decoration:none;border:1.5px solid var(--ink)}
.btn.main{background:var(--ink);color:var(--bg)}
.ring{width:100%;aspect-ratio:1;border-radius:50%;padding:10px;
background:conic-gradient(from 210deg,#e9edf3,#8e99ad,#f5f7fa,#9aa6ba,#e9edf3);
box-shadow:0 0 0 6px rgba(59,123,255,.18),0 0 60px rgba(59,123,255,.35)}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:6px solid var(--bg)}
section{padding:64px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(1.6rem,4vw,2.4rem);margin:0 0 28px;letter-spacing:-.02em}
.about{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.about p{margin:0 0 16px;color:var(--muted);max-width:60ch}
.facts{margin:0;display:grid;gap:14px}
.facts dt{font-size:.8rem;color:var(--muted);font-weight:500}
.facts dd{margin:0;font-weight:600}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.skill{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.skill strong{display:block;font-size:1.1rem}
.skill span{color:var(--muted);font-size:.9rem}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--silver),var(--blue));border-radius:3px}
.proj{display:grid;gap:0}
.item{display:grid;grid-template-columns:150px 1fr;gap:24px;padding:24px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item time{color:var(--muted);font-weight:500;font-size:.9rem}
.item h3{margin:0 0 6px;font-size:1.2rem}
.item p{margin:0;color:var(--muted);max-width:62ch}
.pill{display:inline-block;margin-top:10px;font-size:.78rem;font-weight:600;padding:3px 12px;border-radius:999px;border:1px solid var(--blue);color:var(--blue)}
.contact p{color:var(--muted);max-width:55ch}
footer{padding:32px 0 48px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
@media (max-width:760px){.hero,.about{grid-template-columns:1fr}.item{grid-template-columns:1fr;gap:6px}}
.hero{padding:16px 0 56px}
.stage{position:relative}
.banner{border-radius:20px;overflow:hidden;border:1px solid var(--line);aspect-ratio:2576/639;background:var(--surface)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.ringwrap{position:absolute;left:7%;top:50%;width:min(22%,230px);transform:translateY(-50%)}
.intro{margin-top:24px}
.hero .btns{margin-top:8px}
@media (min-width:761px){.intro{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0}.hero .btns{margin-top:28px}}
@media (max-width:760px){.ringwrap{position:relative;left:auto;top:auto;transform:none;width:150px;margin:24px auto 0}.intro{text-align:center}.tags{justify-content:center}.hero .btns{justify-content:center}}
@media (prefers-reduced-motion:no-preference){.ring{animation:rise .9s ease-out both}@keyframes rise{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}}
body{counter-reset:s}
section:not(.contact) h2::before{counter-increment:s;content:"0" counter(s);display:block;font-size:.75rem;letter-spacing:.18em;color:var(--blue);font-weight:600;margin-bottom:6px}
nav{position:sticky;top:0;z-index:20;margin:0 -24px;padding:14px 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
nav .links{align-items:center}
nav a{padding:4px 0}
nav a.on{color:var(--ink);box-shadow:0 2px 0 var(--blue)}
.tt{font:inherit;background:none;border:1px solid var(--line);color:var(--ink);border-radius:50%;width:34px;height:34px;cursor:pointer}
.tt:hover{border-color:var(--blue)}
.lede{text-align:center;margin:24px auto 0;color:var(--muted);font-size:clamp(1rem,2.2vw,1.2rem);max-width:46ch}
.hero .btns{margin-top:22px;justify-content:center}
.btn{transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,31,69,.18)}
.skill{transition:transform .25s,box-shadow .25s,border-color .25s}
.skill:hover{transform:translateY(-3px);border-color:var(--blue);box-shadow:0 10px 30px rgba(59,123,255,.14)}
.lv{display:block;font-style:normal;font-size:.75rem;font-weight:600;color:var(--blue);margin:2px 0 6px}
.bar i{transform-origin:left;transition:transform .9s .15s cubic-bezier(.2,.7,.2,1)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips span{font-size:.78rem;font-weight:500;padding:4px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
section.contact{border:1px solid var(--line);border-radius:24px;padding:56px 28px;margin:24px 0 56px;background:var(--surface);text-align:center}
.contact p{margin:0 auto 24px}
.contact .btns{justify-content:center}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
footer a{color:var(--muted)}
.js .rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.js .rv.in{opacity:1;transform:none}
.js .skill.rv:not(.in) .bar i{transform:scaleX(0)}
@media (max-width:760px){nav{font-size:.8rem}nav .links{gap:12px}section.contact{padding:40px 20px}}
</style>
</head>
